[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "constraint-cad"
version = "0.1.0"
description = "A small constraint-driven 2D sketch solver and SVG renderer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["constraint_cad*"]
